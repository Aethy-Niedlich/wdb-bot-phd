name: Fixture Regen
on:
  workflow_dispatch:
jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Regen synthetic
        run: node scripts/manifest.mjs --regen
      - name: Append NOTES.md
        run: echo "- Regenerated synthetic fixtures on $(date)" >> brains/NOTES.md
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brains/MANIFEST.json brains/NOTES.md brains/synthetic/
          git commit -m "chore: regen synthetic fixtures"
          git push