name: Fixture Bootstrap
on:
  workflow_dispatch:
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Verify preconditions
        run: |
          node -e "const fs=require('fs'); if(!fs.existsSync('brains/MANIFEST.json')) { console.error('Refuse: manifest absent'); process.exit(1); } const m=JSON.parse(fs.readFileSync('brains/MANIFEST.json','utf8')); if(m.rows && m.rows.length > 0) { console.error('Refuse: rows already exist'); process.exit(1); }"
      - name: Init manifest
        run: node scripts/manifest.mjs --init
      - name: Append NOTES.md
        run: echo "- Bootstrapped manifest with $(git status --porcelain brains/ | wc -l) files" >> brains/NOTES.md
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brains/MANIFEST.json brains/NOTES.md
          git commit -m "chore: bootstrap fixture manifest"
          git push
      - name: Final Check
        run: node scripts/manifest.mjs --check